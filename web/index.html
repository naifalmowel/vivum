<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="فيفوم وكالة رقمية إقليمية تساعد الأعمال في الإمارات والسعودية وسوريا على تحويل أفكارها إلى تجارب رقمية قوية. VIVUM Digital Agency - Creative Design, Technology & AI.">
  <meta name="keywords" content="digital agency, UAE, Saudi Arabia, Syria, web design, AI automation, branding, دبي, الرياض, دمشق, وكالة رقمية, تصميم مواقع, ذكاء اصطناعي">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="VIVUM Digital Agency">
  <meta property="og:description" content="Building Digital Experiences That Help Businesses Grow">
  <meta property="og:image" content="1.png">
  <title>VIVUM Digital Agency</title>

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="1.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase SDKs (Using type="module" for Modern Modular SDK) -->
  <script type="module" src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-check.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-pipelines.js"></script>

  <!-- Patch for Intl.v8BreakIterator deprecation -->
  <script>
    if (!window.Intl || !window.Intl.v8BreakIterator) {
      window.Intl = window.Intl || {};
      window.Intl.v8BreakIterator = function() {
        return { adoptText: function() {}, first: function() { return 0; }, next: function() { return -1; } };
      };
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07091A;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      background: #07091A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    .loader-logo-img {
      height: 64px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 181, 204, 0.3));
      animation: pulseLogo 2s ease-in-out infinite;
    }
    @keyframes pulseLogo {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    .loader-logo {
      font-family: sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.05em;
    }
    .loader-logo span.teal { color: #00B5CC; }
    .loader-logo span.amber { color: #F5A61A; }
    .loader-bar {
      width: 120px;
      height: 2px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 24px;
      overflow: hidden;
    }
    .loader-fill {
      height: 100%;
      background: linear-gradient(90deg, #00B5CC, #F5A61A);
      border-radius: 2px;
      animation: loadfill 1.8s ease forwards;
    }
    @keyframes loadfill {
      from { width: 0; }
      to { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img id="splash-logo" src="1.png" alt="VIVUM Logo" class="loader-logo-img"/>
    <div id="text-logo" class="loader-logo" style="display:none;">vi<span class="teal">v</span>um<span class="amber">.</span></div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>
  <script>
    var splashImg = document.getElementById('splash-logo');
    if (splashImg) {
      splashImg.addEventListener('error', function() {
        splashImg.style.display = 'none';
        var txt = document.getElementById('text-logo');
        if (txt) txt.style.display = 'block';
      });
    }
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
