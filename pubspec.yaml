name: vivum
description: VIVUM Digital Agency - Premium Website
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: ^13.2.0
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2
  visibility_detector: ^0.4.0+2
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.0
  file_picker: ^8.0.0
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
